<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点餐供应商管理系统原型</title>
  <style>
    :root {
      --side: #304156;
      --side-deep: #263445;
      --side-active: #263f5f;
      --blue: #409eff;
      --green: #67c23a;
      --orange: #e6a23c;
      --red: #f56c6c;
      --text: #303133;
      --muted: #909399;
      --line: #ebeef5;
      --bg: #f3f6fb;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr;
    }

    .sidebar {
      background: var(--side);
      color: #bfcbd9;
      min-height: 100vh;
      position: sticky;
      top: 0;
      overflow: auto;
    }

    .brand {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      background: var(--side-deep);
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #409eff, #36cfc9);
      color: #fff;
      font-weight: 800;
    }

    .menu-group-title {
      padding: 16px 18px 8px;
      color: #7f90a5;
      font-size: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 18px;
      cursor: pointer;
      user-select: none;
      border-left: 3px solid transparent;
    }

    .menu-icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 3px;
      background: rgba(255,255,255,.08);
      color: #9fc8ff;
      font-size: 11px;
      font-weight: 700;
    }

    .menu-item:hover { color: #fff; background: #2b3a4d; }
    .menu-item.active {
      color: #fff;
      background: var(--side-active);
      border-left-color: var(--blue);
    }

    .main {
      min-width: 980px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .breadcrumb {
      color: #606266;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #606266;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ecf5ff;
      color: var(--blue);
      font-weight: 700;
    }

    .tabs {
      height: 38px;
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      color: #606266;
      padding: 5px 10px;
      font-size: 12px;
    }

    .tab.active {
      color: var(--blue);
      border-color: #b3d8ff;
      background: #ecf5ff;
    }

    .content {
      padding: 16px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .source-note {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .metric {
      background: var(--card);
      border-radius: 4px;
      padding: 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    .metric-label { color: var(--muted); margin-bottom: 10px; }
    .metric-value { font-size: 26px; font-weight: 700; }
    .metric small { margin-left: 8px; color: var(--green); font-size: 12px; }

    .panel {
      background: var(--card);
      border-radius: 4px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      margin-bottom: 14px;
    }

    .query {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .field {
      width: 180px;
      height: 32px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .field.wide { width: 260px; }
    .field.range { width: 300px; }

    .btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 4px;
      border: 1px solid #dcdfe6;
      background: #fff;
      color: #606266;
      cursor: pointer;
    }

    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.success { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.warning { background: var(--orange); border-color: var(--orange); color: #fff; }
    .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.text { border: 0; color: var(--blue); background: transparent; padding: 0 5px; }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f8f8f9;
      color: #606266;
      font-weight: 600;
    }

    tr:hover td { background: #f5f7fa; }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid #d9ecff;
      color: var(--blue);
      background: #ecf5ff;
    }

    .tag.green { color: #529b2e; background: #f0f9eb; border-color: #e1f3d8; }
    .tag.orange { color: #b88230; background: #fdf6ec; border-color: #faecd8; }
    .tag.red { color: #c45656; background: #fef0f0; border-color: #fde2e2; }
    .tag.gray { color: #73767a; background: #f4f4f5; border-color: #e9e9eb; }

    .pager {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      color: #606266;
      padding-top: 14px;
    }

    .split {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 10px;
      color: #606266;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.35);
      z-index: 20;
    }

    .modal-mask.show { display: flex; }

    .modal {
      width: 680px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 18px 60px rgba(0,0,0,.25);
    }

    .modal-head {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
    }

    .modal-body {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 10px;
    }

    .input {
      height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 10px;
      color: #606266;
    }

    textarea.input {
      height: 86px;
      padding: 8px 10px;
      resize: none;
    }

    .modal-foot {
      padding: 12px 18px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; min-height: auto; }
      .main { min-width: 0; }
      .cards { grid-template-columns: 1fr 1fr; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>

        rows: [

          ["麦当劳券码模板", "MCD-H5-002", "有效期内自动匹配", "启用", "2026-09-05", "320", "500", "麦当劳", "添加链接 查看明细"]

      "auto-detail": {

        source: "src/views/auto/detail/index.vue",

        actions: ["导出"],
        columns: ["链接模板名称", "使用规则", "使用状态", "添加时间", "H5链接", "链接平台", "券码来源", "使用时间", "失效日期", "关联出餐订单", "关联接单记录编号"],

        ]
      }
    };

    function renderMenu(activeKey) {
      const el = document.getElementById("menu");
      el.innerHTML = menus.map(group => `
        <div class="menu-group-title">${group.group}</div>
        ${group.items.map(item => `
          <div class="menu-item ${item.key === activeKey ? "active" : ""}" data-key="${item.key}">
            <span class="menu-icon">${item.icon}</span><span>${item.name}</span>
          </div>
        `).join("")}
      `).join("");
      el.querySelectorAll(".menu-item").forEach(item => {
        item.addEventListener("click", () => renderPage(item.dataset.key));
      });
    }

    function statusTag(value) {
      const text = String(value);
      let type = "";
      if (text.includes("启用") || text.includes("正常") || text.includes("成功") || text.includes("已结算") || text.includes("已上传") || text.includes("营业")) type = "green";
      if (text.includes("待") || text.includes("处理中") || text.includes("未使用")) type = "orange";
      if (text.includes("失败") || text.includes("停用")) type = "red";
      if (text === "-") type = "gray";
      return `<span class="tag ${type}">${text}</span>`;
    }

    function renderTable(page) {
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${page.columns.map(col => `<th>${col}</th>`).join("")}</tr></thead>
            <tbody>
              ${page.rows.map(row => `<tr>${row.map((cell, index) => {
                const col = page.columns[index] || "";
                if (col.includes("状态") || ["启用", "停用", "正常", "成功", "待结算", "已结算", "待上传", "已上传", "未使用", "已使用", "处理中", "待出餐", "已出餐", "出餐失败"].includes(String(cell))) {
                  return `<td>${statusTag(cell)}</td>`;
                }
                if (col === "操作") {
                  return `<td>${String(cell).split(" ").map(action => `<button class="btn text" onclick="openModal('${action}')">${action}</button>`).join("")}</td>`;
                }
                return `<td>${cell}</td>`;
              }).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="pager"><span>共 ${page.rows.length * 37} 条</span><button class="btn">上一页</button><button class="btn primary">1</button><button class="btn">2</button><button class="btn">下一页</button></div>
      `;
    }

    function renderDashboard(page) {
      return `
        <div class="cards">
          <div class="metric"><div class="metric-label">待出餐订单</div><div class="metric-value">126 <small>+32 今日</small></div></div>
          <div class="metric"><div class="metric-label">处理中补偿单</div><div class="metric-value">8 <small>2 超时</small></div></div>
          <div class="metric"><div class="metric-label">可提现金额</div><div class="metric-value">¥28,640</div></div>
          <div class="metric"><div class="metric-label">有效 H5 链接</div><div class="metric-value">3,420 <small>18 即将失效</small></div></div>
        </div>
        <div class="split">
          <div class="panel">
            <h1 style="font-size:16px;margin-bottom:14px;">今日订单趋势</h1>
            <div style="height:260px;display:flex;align-items:end;gap:18px;padding:20px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f8fbff);">
              ${[46, 78, 66, 104, 92, 136, 118, 150, 126, 168, 142, 190].map((h, i) => `<div title="${i + 8}:00" style="width:42px;height:${h}px;background:linear-gradient(180deg,#79bbff,#409eff);border-radius:6px 6px 0 0;"></div>`).join("")}
            </div>
          </div>
          <div class="panel">
            <h1 style="font-size:16px;margin-bottom:14px;">待办动态</h1>
            <div class="timeline">
              <div class="timeline-item"><strong>10:32</strong><span>新订单进入待出餐队列，品牌：瑞幸咖啡</span></div>
              <div class="timeline-item"><strong>10:18</strong><span>补偿单超时预警，请处理用户支付差额</span></div>
              <div class="timeline-item"><strong>09:50</strong><span>H5链接仓库新增 300 条链接</span></div>
              <div class="timeline-item"><strong>09:20</strong><span>提现申请 TX20260911001 已提交</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPage(key) {
      const page = pages[key] || pages.dashboard;
      renderMenu(key);
      document.getElementById("crumb").textContent = page.title;
      document.getElementById("tabTitle").textContent = page.title;
      const content = document.getElementById("content");
      const query = page.filters && page.filters.length ? `
        <div class="panel">
          <div class="query">
            ${page.filters.map(text => `<div class="field ${text.includes("时间") ? "range" : ""}">${text}</div>`).join("")}
            <button class="btn primary">搜索</button>
            <button class="btn">重置</button>
          </div>
        </div>
      ` : "";
      const toolbar = page.actions && page.actions.length ? `<div class="toolbar">${page.actions.map((action, index) => `<button class="btn ${index === 0 ? "primary" : ""}" onclick="openModal('${action}')">${action}</button>`).join("")}</div>` : "";
      content.innerHTML = `
        <div class="page-head">
          <h1>${page.title}</h1>
          <span class="source-note">${page.source}</span>
        </div>
        ${page.dashboard ? renderDashboard(page) : `${query}<div class="panel">${toolbar}${renderTable(page)}</div>`}
      `;
    }

    function openModal(action) {
      const modal = document.getElementById("modal");
      document.getElementById("modalTitle").textContent = action;
      const isMeal = action.includes("手工出餐") || action.includes("重新出餐");
      const isWithdraw = action.includes("余额提现");
      const isLink = action.includes("链接") || action.includes("模板");
      document.getElementById("modalBody").innerHTML = `
        <div class="form-row"><label>${isLink ? "链接模板名称" : isWithdraw ? "提现账户" : isMeal ? "出餐手机尾号" : "名称"}</label><input class="input" value="${isLink ? "瑞幸兑换链接模板" : isWithdraw ? "招商银行 尾号 8899" : isMeal ? "9088" : "示例内容"}"></div>
        <div class="form-row"><label>${isLink ? "链接平台" : isWithdraw ? "提现金额" : isMeal ? "取餐码" : "状态"}</label><input class="input" value="${isLink ? "瑞幸" : isWithdraw ? "5000.00" : isMeal ? "A9K2 / B7Q1" : "启用"}"></div>
        <div class="form-row"><label>${isLink ? "H5链接明细" : "备注"}</label><textarea class="input">${isLink ? "https://demo.h5/lk/001\nhttps://demo.h5/lk/002" : "本地原型示例，可在后续迭代中改为真实字段。"}</textarea></div>
      `;
      modal.classList.add("show");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("show");
    }

    renderPage("dashboard");
  </script>
