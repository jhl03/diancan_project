<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点餐C端开票二期原型交付包</title>
    <style>
      :root {
        color: #213047;
        background: #f3f7fb;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 10%, rgba(65, 149, 255, 0.22), transparent 28%),
          radial-gradient(circle at 88% 20%, rgba(50, 205, 163, 0.18), transparent 26%),
          linear-gradient(135deg, #f7fbff 0%, #edf4fb 100%);
      }

      main {
        box-sizing: border-box;
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0;
      }

      .hero {
        padding: 36px;
        border: 1px solid rgba(73, 111, 158, 0.16);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(54, 92, 138, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 48px);
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        color: #65758d;
        font-size: 17px;
        line-height: 1.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 28px;
      }

      a.card {
        display: block;
        padding: 24px;
        border: 1px solid rgba(58, 125, 214, 0.16);
        border-radius: 22px;
        color: inherit;
        text-decoration: none;
        background: #fff;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }

      a.card:hover {
        transform: translateY(-4px);
        border-color: rgba(43, 126, 255, 0.45);
        box-shadow: 0 18px 40px rgba(49, 107, 181, 0.18);
      }

      .card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 21px;
      }

      .card span {
        color: #75849a;
        font-size: 14px;
        line-height: 1.7;
      }

      .note {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 18px;
        color: #53637b;
        background: rgba(33, 112, 224, 0.08);
        line-height: 1.8;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 1080px);
          padding: 28px 0;
        }

        .hero {
          padding: 24px;
          border-radius: 22px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>点餐C端开票二期原型交付包</h1>
        <p class="subtitle">
          本交付包已处理为仓库静态访问版本，上传到 GitHub Pages、Gitee Pages 或同类静态仓库页面后，可通过仓库链接直接打开以下系统。
        </p>

        <div class="grid">
          <a class="card" href="./供应商后台系统/">
            <strong>供应商后台系统</strong>
            <span>包含售后补贴单、补偿单、合并上传、重新合并上传等供应商后台改动。</span>
          </a>
          <a class="card" href="./供应商小程序/">
            <strong>供应商小程序</strong>
            <span>包含售后补贴单移动端列表、勾选、合并上传、发票字段展示等改动。</span>
          </a>
          <a class="card" href="./点餐后台系统/">
            <strong>点餐后台系统</strong>
            <span>包含开票订单、售后补贴单状态和字段展示相关改动。</span>
          </a>
        </div>

        <div class="note">
          使用方式：将本目录内容提交到仓库并开启 Pages 后，访问仓库 Pages 根地址即可看到此入口页；也可以直接访问各系统的 index.html。
        </div>
      </section>
    </main>
  </body>
</html>
